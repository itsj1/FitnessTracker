<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="theme-color" content="#1b2a2f">
<title>Muscu</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--bl:#3b82f6;--ink:#0b0b0a;--mut:#6f6f6b;--acc:#00c56a;--acc2:#00a157;--mint:#c4ebd7;--ok:#00c56a;--red:#e5484d;--line:#e6e6e2;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14201f;--card:#1e2d2c;--ink:#eef0ea;--mut:#92a3a0;--acc:#1fd47f;--acc2:#4ade9d;--mint:#1f4a3a;--ok:#1fd47f;--red:#f06a6a;--line:#34464a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#14201f;--card:#1e2d2c;--ink:#eef0ea;--mut:#92a3a0;--acc:#1fd47f;--acc2:#4ade9d;--mint:#1f4a3a;--ok:#1fd47f;--red:#f06a6a;--line:#34464a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Trebuchet MS",system-ui,sans-serif;padding:env(safe-area-inset-top) 12px calc(90px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
h1{font:800 28px/1.15 "Avenir Next","Trebuchet MS",system-ui,sans-serif;letter-spacing:-.01em;margin:16px 0}
header{display:flex;align-items:center;justify-content:space-between}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:16px}
button{border:0;border-radius:8px;padding:10px 14px;background:var(--line);cursor:pointer}
.p{background:var(--acc);color:#04210f;font-weight:700}
.big{width:100%;padding:14px;margin:8px 0}
.card,details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
summary{font-weight:600;cursor:pointer}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.it{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.mut{color:var(--mut);font-size:14px}
.ex{border-left:4px solid var(--acc)}
.ex.ss{margin-left:14px;border-left-color:var(--ok)}
.num{font:700 22px Georgia,serif;min-width:38px;color:var(--acc)}
.sr{display:grid;grid-template-columns:44px 1fr 1fr 44px 34px;gap:6px;margin:6px 0;align-items:center}
.sr input{text-align:center}
.sr .lab{padding:10px 0;font-weight:700}
.sr.ok input{border-color:var(--ok)}
.sr.ok .okb{background:var(--ok);color:#04210f}
.sh{font-size:13px;color:var(--mut);text-align:center}
.desc{font-size:13px;color:var(--mut);margin:4px 0 8px}
.stats{display:flex;gap:8px;text-align:center}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.stats b{display:block;font:700 20px Georgia,serif}
#timer{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font:700 20px Georgia,serif;display:flex;justify-content:space-between;align-items:center}
#timer[hidden]{display:none}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0}
label.ck input{width:auto}
.regs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin:0 0 8px}
.sec{font-weight:700;font-size:15px;margin:12px 0 4px}
.regs label{font-size:12px;line-height:1.2;color:var(--mut);min-width:0}
.regs input{margin-top:4px;padding:10px 4px;text-align:center}
.ex details{background:none;padding:8px 10px;margin:8px 0}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--bg)}
.opt small{display:block;font-size:12px;font-weight:400;color:var(--mut);margin-top:2px}
.opt.on{outline:2px solid var(--acc)}
.row2{display:flex;gap:8px}
.bar2{display:flex;gap:8px;margin:8px 0}
.bar2>*{flex:1}
.dng{background:var(--red);color:#fff;font-weight:600}
.dng:disabled{opacity:.4}
.it.sel{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.bx{font-size:20px;margin-right:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.dlg{background:var(--card);border-radius:12px;padding:18px;max-width:380px;width:100%}
.dlg p{margin:0 0 14px}
.top2{display:flex;gap:10px;margin:8px 0}
.top2>button{flex:1;padding:16px 12px;text-align:left}
.top2 .go{display:flex;align-items:center;gap:12px;background:#43b87c;color:#fff;font-weight:700;border-radius:20px}
.top2 .go b{display:block;font-size:17px;line-height:1.15}
.top2 .go small{display:block;font-weight:500;font-size:13px;color:#fff;opacity:.9;margin-top:2px;line-height:1.2}

.top2 .plus{border-radius:20px}
.plus{text-align:center!important;font-weight:700;background:var(--card);border:1px solid var(--line)}
.plus span{display:block;font-size:24px;line-height:1}
.h2{font:700 13px monospace;letter-spacing:.06em;color:var(--mut)}
.line{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.grow{flex:1;min-width:0}
.hd{touch-action:none;cursor:grab;color:var(--mut);padding:6px 4px;user-select:none;-webkit-user-select:none;letter-spacing:-2px}
.chev{padding:6px;cursor:pointer}
.ico{font-size:22px}
.ib{padding:6px 12px;background:none;border:1px solid var(--line)}
.sub,.tpl{margin-left:14px}
.trow{display:flex;gap:8px;align-items:flex-start}
.names{font-size:14px;margin:8px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.last{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;cursor:pointer;font-size:13px}
.drag{opacity:.5}
.over{outline:2px dashed var(--acc)}
.icons{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.ic{font-size:20px;padding:6px 10px}
.ic.on{outline:2px solid var(--acc)}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:5}
.tabs button{flex:1;background:none;border-radius:999px;display:flex;flex-direction:column;align-items:center;font-size:12px;padding:6px}
.tabs button.on{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);font-weight:700}
.tabs span{display:block;height:24px;margin-bottom:2px}
.tpl{position:relative;border-left:4px solid var(--c);padding-left:50px}
.tpl>.hd{position:absolute;left:8px;top:12px}
.sw{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.lh{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.lrow{display:flex;align-items:center;gap:10px}
.live{font:700 12px monospace;letter-spacing:.06em;color:var(--acc)}
.lstats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;background:var(--bg);border-radius:10px}
.lstats div{padding:10px;text-align:center}
.lstats span{display:block;font:12px monospace;color:var(--mut);letter-spacing:.05em}
.lstats b{font:700 22px Georgia,serif}
.lstats small{font-size:12px;font-weight:400;color:var(--mut)}
.lex{border-radius:16px;padding:14px}
.ltab{background:var(--bg);border-radius:12px;padding:6px;margin-top:10px}
.lr{display:grid;grid-template-columns:34px 1fr 1fr 1fr 46px;align-items:center;gap:6px;padding:6px;border-radius:8px}
.lr>span{text-align:center}
.lhd{font:12px monospace;color:var(--mut);padding-bottom:2px}
.lr input{border:0;background:transparent;text-align:center;font-weight:700;font-size:18px;padding:8px 0}
.lr.ok{background:color-mix(in srgb,var(--acc) 15%,transparent)}
.lr .okb{padding:10px 0;background:var(--card);border:2px solid var(--line);color:transparent}
.lr.ok .okb{background:var(--acc);border-color:var(--acc);color:#fff}
.dash{width:100%;border:2px dashed var(--line);background:none;color:var(--acc);margin-top:6px}
#timer{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.18);font:inherit;z-index:6}
.tl{font:12px monospace;color:var(--mut);letter-spacing:.05em}
.tt{font:700 28px Georgia,serif}
.tbt{display:flex;gap:8px}
.tpl .p{background:var(--c);color:#0b0b0a}
.tpl .last{border-left:4px solid var(--c)}
.tpl>.th{padding-right:46px}
.tpl>.tm{position:absolute;right:10px;top:10px}
.tpl>.hd{left:10px;top:14px}
.menu2{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.exh{display:grid;grid-template-columns:46px 1fr 44px;align-items:center;gap:4px 0;margin-bottom:8px}
.exh .num{grid-area:1/1}
.exh .sec{grid-area:1/2;margin:0}
.exh input{grid-area:2/2}
.exh button{grid-area:2/3;margin-left:6px;padding:10px 0}
.menu{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;margin:0 0 10px}
.menu button{text-align:left;background:none;padding:12px}
 
.pkdlg{display:flex;flex-direction:column;max-width:420px;max-height:calc(100dvh - 40px)}
.pkl{overflow-y:auto;flex:1;min-height:0;margin:8px 0 12px}
.pkd{display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-weight:700}
.pks{display:flex;align-items:center;gap:6px;margin:8px 0 0 14px;font-size:14px;color:var(--mut);font-weight:600}
.pkt{width:calc(100% - 28px);margin:6px 0 0 28px;border-left:4px solid var(--c)}
 
.ah{display:flex;align-items:center;gap:6px;margin:14px 0 8px}
.ah button{background:none;padding:0}
.ah .nv{font-size:28px;line-height:1;color:var(--mut);padding:2px 4px}
.mt{display:flex;align-items:baseline;gap:6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.mt b{font:700 25px/1 "Avenir Next Condensed","Arial Narrow","Helvetica Neue",sans-serif;letter-spacing:-.01em}
.mt span{font:12px ui-monospace,Menlo,monospace;color:var(--mut);letter-spacing:.08em}
.ah .tdy{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);font-weight:700;font-size:13px;border-radius:999px;padding:6px 11px}
.ah .pls{color:var(--acc);font-size:32px;font-weight:300;line-height:1;padding:0 4px}
.ah .pill.rnd{background:var(--mint);margin-left:4px}
.thseg{display:flex;gap:8px;margin-top:12px}.thseg button{flex:1;padding:13px 6px;border-radius:14px;background:var(--bg);border:2px solid var(--line);font-weight:600;color:var(--ink)}.thseg button.on{border-color:var(--acc);color:var(--acc)}
.ah .av{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;font-size:19px;box-shadow:0 2px 8px rgba(0,0,0,.18);flex:none;margin-left:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:0;text-align:center}
.cal .wd{font:12px ui-monospace,Menlo,monospace;color:var(--mut);padding:10px 0 4px}
.cd{background:none;padding:4px 0 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:46px;font-size:20px;font-weight:500}
.cd i{width:6px;height:6px;border-radius:50%;background:transparent;display:block}
.cd.has i{background:var(--acc)}
.cd.o{color:var(--mut)}.cd.o span{opacity:.55}.cd.o.has i{opacity:.45}
.cd.tod span{color:var(--acc);font-weight:800}
.cd.sel{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.sc div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sc b{display:block;font:700 30px/1 "Avenir Next Condensed","Arial Narrow","Helvetica Neue",sans-serif;margin-bottom:8px}
.sc span{font:12px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.lh2{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.lh2 button{background:none;color:var(--acc);font-weight:600;padding:4px 0}
.dgh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 6px;scroll-margin-top:12px}
.dgh b{font:700 17px "Avenir Next Condensed","Arial Narrow","Helvetica Neue",sans-serif;text-transform:uppercase}
.dgh span{font:13px ui-monospace,Menlo,monospace;color:var(--mut)}
.ac{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ac>i{align-self:stretch;width:5px;border-radius:3px;background:var(--c);flex:none}
.ac.sel{background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.ac b{font:700 20px/1.2 "Avenir Next Condensed","Arial Narrow","Helvetica Neue",sans-serif}
.ac .tm{font:600 14px ui-monospace,Menlo,monospace;letter-spacing:.03em}
.ac .en{font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:var(--acc)}
.ac .me{margin-top:3px;line-height:1.5}
.cbtn{width:36px;height:36px;border-radius:50%;padding:0;background:var(--card);border:0;box-shadow:0 1px 6px rgba(0,0,0,.14);display:grid;place-items:center;flex:none;color:var(--ink)}
.live{color:var(--mut)!important}.live:before{content:'●';color:var(--acc);margin-right:6px}
.lhd2{display:flex;align-items:center;gap:10px}
.lr.f{grid-template-columns:34px 1fr 1fr 1fr 46px 30px}
.tplv .lr .okb,.edv .lr .okb{visibility:hidden}
.lr.f .tg{background:none;border:0;padding:8px 0;font-weight:700;color:var(--ink);border-radius:8px}
.lr.f .tg.e{color:var(--acc)}
.lr .rm{background:none;border:0;padding:6px 0;color:var(--mut);font-size:18px}
.fh{display:flex;align-items:center;gap:8px}
.fh input{flex:1;font-size:17px}
.xa{width:34px;height:34px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.xa svg{transition:transform .15s}.xa.on svg{transform:rotate(180deg)}
.fr{display:flex;align-items:center;gap:8px;margin-top:8px}
.fr input{width:84px;text-align:center;font-weight:700;padding:6px}
.soft{background:color-mix(in srgb,var(--ink) 4%,var(--card))!important;border:1px solid color-mix(in srgb,var(--line) 55%,transparent)!important;color:var(--ink);font-weight:600}
.soft::placeholder{color:var(--mut);font-weight:400;opacity:.8}
.xw{margin:12px 0 0 18px}
.xp{background:var(--bg);border-radius:12px;border-left:4px solid var(--acc);padding:18px 18px 10px 20px}
.xp>.sec:first-child{margin-top:0}
.xp .sec{margin-bottom:8px}
.xp .sec+select,.xp .sec+input{margin-bottom:12px}
.xp .xs{padding-left:11px;margin:-4px 0 12px}
.fb{border-left:4px solid var(--acc)}
.cr{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.cr b{font-weight:700;font-size:15px}
.xp select,.xp input{margin-bottom:8px}
.xs{font-size:12px;color:var(--mut);margin-top:6px}
.lh .ltitle{font-weight:700;font-size:22px;line-height:1.25;margin:2px 0 0}
.lstats>div:first-child{background:color-mix(in srgb,var(--acc) 16%,transparent);border-radius:10px 0 0 10px}
#mini{position:fixed;left:12px;top:calc(8px + env(safe-area-inset-top));width:min(calc(100vw - 24px),420px);z-index:7;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;margin:0;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#mini[hidden]{display:none}
#mini.mv{cursor:grabbing;opacity:.92}
#mini .lstats{margin-top:8px}
#mini .lstats div{padding:6px}
#mini .lstats b{font-size:18px}
#mini .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
#mini .hint{font:12px monospace;color:var(--mut);margin-left:auto}
.tabs{left:50%;right:auto;transform:translateX(-50%);width:min(300px,calc(100% - 80px));max-width:none;margin:0}
.fico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);position:relative}
.fico.dot::after{content:"";position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid var(--card)}
.qadd{display:flex;gap:8px;margin:8px 0}
.kids{margin:-2px 0 6px 36px;padding-left:32px;border-left:2px solid var(--line)}
.kids .sub,.kids .tpl{margin-left:0}
.qadd button{flex:1;border:2px dashed var(--line);background:none;color:var(--mut);font-weight:700;letter-spacing:.04em;border-radius:14px;padding:12px 4px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;white-space:nowrap}
.sov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sh-h{display:flex;align-items:center;gap:14px;padding:6px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}

.sh-h .mut{display:block;margin-top:2px}
.sh-bar{width:6px;align-self:stretch;min-height:44px;border-radius:3px;background:var(--c);flex:none}

.sit i{flex:none;width:46px;height:46px;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--mut)}
.sit.go{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.sit.go i{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
.sit.red{color:var(--red)}
.sit.red i{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.sh-l{font-size:12px;letter-spacing:.14em;color:var(--mut);margin:16px 8px 10px;font-family:ui-monospace,Menlo,monospace}

.sws button{width:42px;height:42px;border-radius:50%;padding:0;border:3px solid transparent;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 0 0 2px var(--card)}

.igr{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;padding:0 8px}

.igr button.on{background:color-mix(in srgb,var(--c) 24%,transparent);border-color:var(--c)}

/* GitHub */
const api=()=>`https://api.github.com/repos/${S.cfg.repo}/contents/${S.cfg.path||'muscu-data.json'}`;
const H=()=>({Authorization:'Bearer '+S.cfg.token,Accept:'application/vnd.github+json'});
async function pull(){const r=await fetch(api(),{headers:H(),cache:'no-store'});if(r.status===404){S.sha='';return null}
 if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();S.sha=j.sha;
 return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0))))}
async function push(){let b='';new TextEncoder().encode(JSON.stringify({seances:S.seances.filter(x=>!x.draft),acc:S.acc,dos:S.dos,dosU:S.dosU||0},null,1)).forEach(c=>b+=String.fromCharCode(c));
 const r=await fetch(api(),{method:'PUT',headers:H(),body:JSON.stringify({message:'Sync '+new Date().toISOString(),content:btoa(b),sha:S.sha||undefined})});
 if(!r.ok)throw new Error('GitHub '+r.status);S.sha=(await r.json()).content.sha}
async function sync(){if(!S.cfg.repo||!S.cfg.token)return;msg='Synchronisation…';
 try{const rm=await pull();if(rm){const m=new Map(S.seances.map(x=>[x.id,x]));rm.seances.forEach(x=>{const l=m.get(x.id);if(!l||(x.u||0)>(l.u||0))m.set(x.id,x)});S.seances=[...m.values()];S.acc=[...new Set([...S.acc,...(rm.acc||[])])];if(rm.dos&&(rm.dosU||0)>(S.dosU||0)){S.dos=rm.dos;S.dosU=rm.dosU}}
 try{await push()}catch{await pull();await push()}msg='Synchronisé à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
 catch(e){msg='Échec de la synchronisation : '+e.message+' (vérifie dépôt, jeton, réseau)'}save()}
